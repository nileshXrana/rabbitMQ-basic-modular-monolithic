services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - .env

    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:17

    env_file:
      - .env

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4

    env_file:
      - .env

    ports:
      - "5050:80"

    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:4-management

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      

volumes:
  backend_node_modules:
  postgres_data:
  rabbitmq_data: